version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # <-- clé corrigée
    networks:
      - app-network

volumes:
  mysql_data:  # <-- tu dois déclarer ton volume ici

networks:
  app-network:
    driver: bridge
